name: CI/CD Pipeline

# Run the pipeline on every push to main and on pull requests to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ------------------------------------------
  # JOB 1 - TEST
  # ------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Version check
        run: |
          python --version
          pip --version
          pytest --version
          flake8 --version
          dvc --version

      - name: Pull data with DVC
        run: |
          dvc pull || echo "No DVC remote configured - skipping dvc pull"

      - name: Run unit tests
        run: |
          pytest -v

  # ------------------------------------------
  # JOB 2 - LINT
  # ------------------------------------------
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tool
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 src tests

  # ------------------------------------------
  # JOB 3 - BUILD (runs only if test and lint pass)
  # ------------------------------------------
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      - test
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: |
          python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
